name: NuGet Package Updates

on:
  schedule:
    # Run weekly on Mondays at 6:00 AM UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: eros-develop
          fetch-depth: 1
          fetch-tags: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dotnet-outdated tool
        run: dotnet tool install --global dotnet-outdated-tool

      - name: Restore NuGet packages
        working-directory: src
        run: |
          echo "Restoring NuGet packages..."
          dotnet restore Whisparr.sln --verbosity minimal

      - name: Check for outdated packages
        id: check-outdated
        working-directory: src
        timeout-minutes: 10
        run: |
          # Get list of outdated packages
          echo "Checking for outdated packages..."
          dotnet list Whisparr.sln package --outdated > outdated_packages.txt 2>&1 || true

          # Display the output
          cat outdated_packages.txt

          # Check if there are any outdated packages (excluding header lines)
          if grep -q ">" outdated_packages.txt; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "Found outdated packages"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "No outdated packages found"
          fi

      - name: Generate update summary
        id: summary
        if: steps.check-outdated.outputs.has_updates == 'true'
        working-directory: src
        run: |
          # Create a formatted summary for the PR body
          echo "## NuGet Package Updates" > update_summary.md
          echo "" >> update_summary.md
          echo "The following packages have updates available:" >> update_summary.md
          echo "" >> update_summary.md
          echo "\`\`\`" >> update_summary.md
          cat outdated_packages.txt >> update_summary.md
          echo "\`\`\`" >> update_summary.md
          echo "" >> update_summary.md
          echo "---" >> update_summary.md
          echo "*This PR was automatically generated by the NuGet Updates workflow*" >> update_summary.md

          # Store summary for later use
          echo "SUMMARY<<EOF" >> "$GITHUB_OUTPUT"
          cat update_summary.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create report file for PR
        if: steps.check-outdated.outputs.has_updates == 'true'
        working-directory: src
        run: |
          # Create a report file that will be committed to the PR branch
          cp update_summary.md NUGET_UPDATES_REPORT.md
          echo "" >> NUGET_UPDATES_REPORT.md
          echo "Last scanned: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> NUGET_UPDATES_REPORT.md

      - name: Create or Update Pull Request
        if: steps.check-outdated.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Chore: Update NuGet package report"
          branch: nuget-updates-report
          delete-branch: false
          title: "Chore: NuGet Package Updates Available"
          body: |
            ${{ steps.summary.outputs.SUMMARY }}

            ---

            **Note**: This PR is automatically updated weekly with the current list of available package updates.
            Manual update is required due to circular project references in Whisparr.Common and Whisparr.Common.Tests.

            To manually update packages, run: `dotnet outdated src/Whisparr.sln -u`

            **Last scanned**: Run #${{ github.run_number }} at ${{ github.event.repository.updated_at }}
          labels: |
            dependencies
            nuget

      - name: Close PR if no updates
        if: steps.check-outdated.outputs.has_updates == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if the PR exists and close it if no updates are needed
          PR_NUMBER=$(gh pr list --head nuget-updates-report --json number --jq '.[0].number' || echo "")
          if [ -n "$PR_NUMBER" ]; then
            echo "Closing PR #$PR_NUMBER as all packages are up to date"
            gh pr close "$PR_NUMBER" --comment "All NuGet packages are now up to date. Closing this PR."
          else
            echo "No existing PR to close"
          fi

      - name: No updates needed
        if: steps.check-outdated.outputs.has_updates == 'false'
        run: echo "All packages are up to date!"
