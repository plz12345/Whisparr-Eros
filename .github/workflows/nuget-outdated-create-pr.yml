name: NuGet Package Updates

on:
  schedule:
    # Run daily at 6:00 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: eros-develop
          fetch-depth: 1
          fetch-tags: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dotnet-outdated tool
        run: dotnet tool install --global dotnet-outdated-tool

      - name: Restore NuGet packages
        working-directory: src
        run: |
          echo "Restoring NuGet packages..."
          dotnet restore Whisparr.sln --verbosity minimal

      - name: Check for outdated packages
        id: check-outdated
        working-directory: src
        timeout-minutes: 10
        run: |
          # Get list of outdated packages
          echo "Checking for outdated packages..."
          dotnet list Whisparr.sln package --outdated > outdated_packages.txt 2>&1 || true

          # Display the output
          cat outdated_packages.txt

          # Check if there are any outdated packages (excluding header lines)
          if grep -q ">" outdated_packages.txt; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "Found outdated packages"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "No outdated packages found"
          fi

      - name: Generate update summary
        id: summary
        if: steps.check-outdated.outputs.has_updates == 'true'
        working-directory: src
        run: |
          # Create a formatted summary for the PR body
          echo "## NuGet Package Updates" > update_summary.md
          echo "" >> update_summary.md
          echo "The following packages have updates available:" >> update_summary.md
          echo "" >> update_summary.md
          echo "\`\`\`" >> update_summary.md
          cat outdated_packages.txt >> update_summary.md
          echo "\`\`\`" >> update_summary.md
          echo "" >> update_summary.md
          echo "---" >> update_summary.md
          echo "*This PR was automatically generated by the NuGet Updates workflow*" >> update_summary.md

          # Store summary for later use
          echo "SUMMARY<<EOF" >> "$GITHUB_OUTPUT"
          cat update_summary.md >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update packages
        if: steps.check-outdated.outputs.has_updates == 'true'
        working-directory: src
        run: |
          echo "Updating packages..."
          # Use dotnet-outdated tool to update packages
          # -u flag updates the packages, -t flag includes transitive dependencies
          dotnet outdated Whisparr.sln -u

      - name: Check for changes
        id: check-changes
        if: steps.check-outdated.outputs.has_updates == 'true'
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected in project files"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes made to project files"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Chore: Update NuGet packages"
          branch: nuget-updates-${{ github.run_number }}
          delete-branch: true
          title: "Chore: Update NuGet packages"
          body: ${{ steps.summary.outputs.SUMMARY }}
          labels: |
            dependencies
            nuget
          assignees: ${{ github.repository_owner }}

      - name: No updates needed
        if: steps.check-outdated.outputs.has_updates == 'false'
        run: echo "All packages are up to date!"
