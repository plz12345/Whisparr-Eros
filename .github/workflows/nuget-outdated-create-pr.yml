# This GitHub Action checks for outdated NuGet packages and creates a PR if updates are available.
# It uses dotnet-outdated-tool to update packages automatically.
# Place this file in .github/workflows/nuget-update.yml

name: "NuGet Package Updater"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6am UTC

jobs:
  update-nuget-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dotnet-outdated tool
        run: dotnet tool install --global dotnet-outdated-tool

      - name: Run dotnet list package --outdated
        run: |
          dotnet list src/Whisparr.sln package --outdated > outdated-report.txt
        continue-on-error: true

      - name: Check for changes
        id: git-check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Check for outdated packages in report
        id: outdated-check
        run: |
          if grep -q '>' outdated-report.txt; then
            echo "outdated=true" >> $GITHUB_OUTPUT
          else
            echo "outdated=false" >> $GITHUB_OUTPUT
          fi

      - name: Get outdated report
        if: steps.outdated-check.outputs.outdated == 'true'
        id: outdated-report
        run: |
          echo 'body<<EOF' >> $GITHUB_OUTPUT
          echo 'Automated update of NuGet dependencies using dotnet list package --outdated.' >> $GITHUB_OUTPUT
          echo '' >> $GITHUB_OUTPUT
          echo '````' >> $GITHUB_OUTPUT
          cat outdated-report.txt >> $GITHUB_OUTPUT
          echo '````' >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create or Update Pull Request
        if: steps.outdated-check.outputs.outdated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: report NuGet outdated packages"
          title: "Chore: report NuGet outdated packages"
          body: ${{ steps.outdated-report.outputs.body }}
          branch: "auto/nuget-update"
          delete-branch: true
